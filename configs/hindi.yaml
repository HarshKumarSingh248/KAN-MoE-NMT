language: hindi
data_dir: data/hindi
nllb_dir: models/nllb-200-1.3B
output_dir: runs/hindi
seed: 42
epochs: 5
model:
  d_model: 1024
  kan_hidden: 2048
  kan_basis: 16
  n_experts: 4
  kan_dropout: 0.1
  moe_aux_wt: 0.05
  fourier_freqs: 16
training:
  batch_size: 8
  grad_accum: 4
  lr_kan: 0.0003
  lr_decoder: 0.00001
  lr_encoder: 0.00001
  warmup_steps: 2000
  grad_clip: 1.0
  patience: 5
  max_src_len: 128
  max_tgt_len: 128
generation:
  beam_size: 5
  length_penalty: 1.0
  no_repeat_ngram: 3
  repetition_penalty: 1.15
